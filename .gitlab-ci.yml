# Runs on every push. No AWS credentials are stored in CI and nothing here talks to AWS or Qrypt.
stages:
  - lint
  - test
  - terraform

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.python:
  image: python:3.13-slim
  cache:
    key: pip-$CI_JOB_NAME
    paths: [.cache/pip]
  before_script:
    - pip install -q -r requirements-dev.txt

ruff:
  extends: .python
  stage: lint
  script:
    - ruff check src tests
    - ruff format --check src tests

pytest:
  extends: .python
  stage: test
  script:
    - pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

terraform-validate:
  stage: terraform
  image:
    name: hashicorp/terraform:1.17.0
    entrypoint: [""]
  script:
    - cd infra
    - terraform fmt -check -recursive
    - terraform init -backend=false -input=false
    - terraform validate

tflint:
  stage: terraform
  image:
    name: ghcr.io/terraform-linters/tflint:v0.65.0
    entrypoint: [""]
  script:
    - cd infra
    - tflint --init --config "$(pwd)/.tflint.hcl"
    - tflint --recursive --config "$(pwd)/.tflint.hcl"

checkov:
  stage: terraform
  image: python:3.12-slim # Checkov's own supported range
  script:
    - pip install -q checkov==3.3.30
    - checkov -d infra --quiet --compact --framework terraform
